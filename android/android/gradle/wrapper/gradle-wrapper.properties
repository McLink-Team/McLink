# Gradle 发行版来源 —— 与 Capacitor 模板的默认值有两处**刻意**的偏离，都写在这里。
#
# 1) 换成腾讯云镜像，而不是官方 services.gradle.org。
#    原因：官方地址会 307 跳到 github.com/gradle/gradle-distributions/releases/...，
#    而 GitHub Releases 在部分网络环境下不可达。失败的形态很有迷惑性 ——
#    Gradle wrapper 只报 "Downloading ... failed: timeout (10000ms)"，
#    完全不提它其实卡在了 GitHub 上，于是人会去查网络、查代理、查防火墙。
#    镜像同样提供 gradle-x.y.z-bin.zip，且支持 Range 请求（实测 206）。
#    想换回官方地址：把下面这行的 host 换回 services.gradle.org/distributions 即可，
#    其余字段（文件名、超时、校验开关）都不用动。
#    华为云镜像 mirrors.huaweicloud.com/gradle/ 同样可用，作为备用。
#
# 2) 用 -bin 而不是模板默认的 -all。
#    -all 额外带源码与 javadoc（约 200MB，-bin 约 130MB），只有"在 IDE 里点进 Gradle
#    源码"这一个用途。Android 端构建不需要它，所以省掉这 70MB 的下载。
#
# networkTimeout 从模板的 10000 提到 120000：这是**每次读**的超时，
# 10 秒对跨境下载太紧，一次抖动就整体失败（上面那次的直接死因就是这个）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.11.1-bin.zip
networkTimeout=120000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
