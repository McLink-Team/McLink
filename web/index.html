    <!--
      ============================================================ TDK
      两点说明：
      1. 主控服务这些页面时会把 title / description / canonical / og:url 里的站点信息
         换成**平台设置里的站点名与简介**（server/src/api/shell.ts），
         所以下面是"读不到设置时的默认值"，不是唯一事实来源。
      2. 长度按**中文**定，不照搬英文的 50–60 / 150–160 字符：
         中文搜索结果页标题约 30 个汉字、摘要约 78 个汉字就会被截断，
         按英文标准写只会让关键词被砍掉。当前标题 22 字、摘要 78 字。
    -->
    <title>McLink 联机 · 支持《我的世界》等各类局域网联机游戏</title>

    <meta name="twitter:title" content="McLink 联机 · 支持《我的世界》等各类局域网联机游戏" />
    <meta
      name="twitter:description"
      content="像在同一局域网里一样开黑：支持《我的世界》等各类局域网联机游戏，单端口承载所有房间，P2P 打洞直连、自动回退。"
    />

    <!-- 结构化数据：让搜索引擎知道这是个什么站点，而不是一个空壳 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "McLink 联机",
        "alternateName": "McLink",
        "url": "https://cnnic.link/",
        "description": "基于 EasyTier 的局域网联机平台：支持《我的世界》等各类局域网联机游戏，单端口承载所有房间，按区域就近接入中继，P2P 打洞直连与自动回退。",
        "inLanguage": "zh-CN",
        "publisher": { "@type": "Organization", "name": "McLink", "url": "https://cnnic.link/" }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "McLink 客户端",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Windows 10, Windows 11, macOS",
        "url": "https://cnnic.link/download",
        "softwareVersion": "1.0.4",
        "description": "登录后选择区域、输入加入码即可与朋友联机（《我的世界》等各类局域网联机游戏通用）；内置 EasyTier 核心，无需手工配置网络名、密钥或中继地址。",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "CNY" }
      }
    </script>

    <script>
      /*
       * 亮/暗主题：必须在首屏绘制前跑，否则会闪一下。
       * 逻辑与 packages/shared/src/design/theme.ts 一致，这里内联一份（模块化加载太晚）。
       * 改了这里记得同步那个文件。
       *
       * 优先级：?theme=light|dark（检测器与本地核对用） > localStorage['mclink.theme']（用户选的）
       *         > 系统偏好。
       * 中间那层不能省：玩家选了「亮色」之后刷新，如果这里只按系统画，
       * 会先出一帧暗色再跳到亮色 —— 那就是闪烁。
       */
      (function () {
        try {
          var forced = new URLSearchParams(location.search).get('theme');
          var saved = null;
          try {
            saved = window.localStorage.getItem('mclink.theme');
          } catch (e) {
            /* 隐私模式读不到 localStorage，只能跟随系统 */
          }
          var theme =
            forced === 'light' || forced === 'dark'
              ? forced
              : saved === 'light' || saved === 'dark'
                ? saved
                : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                  ? 'light'
                  : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!--
      不执行 JS 的抓取器（尤其百度）看到的就是下面这段。

      所以放一段**真实可读**的站点说明与入口链接：对人无害（有 JS 时应用盖住它），
      对爬虫是唯一的正文来源。服务时会把站点名替换成平台设置里的值（api/shell.ts）。

        底层使用 EasyTier 组网：主控单端口承载所有房间，玩家按区域就近接入中继，
        能打洞时走 P2P 直连，受限网络自动回退中继。
      </p>
      <ul>

      <p>

      </p>
      <p>本站需要启用 JavaScript 才能使用完整功能。</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
