# electron-builder 打包配置
#
# 品牌写法统一为 McLink（productName / 快捷方式 / 安装包名都面向玩家可见）。
# appId 保持不变：它是注册表与升级标识，改了会让老版本无法原地升级。
#
# 注意 productName 同时决定**安装目录与 userData 目录**（Windows 路径不区分大小写，
# 所以 mclink → McLink 不会丢失已登录状态）。改完要重新 `pnpm dist:client` 才生效，
# 同时把主控设置里的「客户端下载地址」改成本次产物名（或留空由下载页自动挑选）。
appId: com.mclink.client
productName: McLink
copyright: McLink · 基于 EasyTier 的《我的世界》联机平台

directories:
  output: release
  buildResources: build

# 只打包运行必需的文件；源码与开发脚本不进安装包
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,docs}/**'
# 注意：运行时用的图标在 client/electron/assets/icon.ico（随 electron/ 一起进 asar）。
# 不要写 `- build/icon.ico`：build/ 是 buildResources，electron-builder 会**自动排除**它，
# 写了也不生效 —— 现象是打包后 appIconPath() 找不到图标，托盘变成一个看不见的空图标。

# EasyTier 核心以「额外资源」形式随包分发（保持其原始二进制，不做修改）
# 清单与 client/scripts/build.mjs 的 WANTED_VENDOR_FILES 必须一致：
# 用通配符会连 Linux 二进制一起打进 Windows 安装包（约 10MB），
# 漏掉 WinDivert64.sys / Packet.dll 则「局域网广播直通」在打包版里静默失效。
extraResources:
  - from: vendor/easytier
    to: vendor/easytier
    filter:
      - 'easytier-core.exe'
      - 'easytier-cli.exe'
      - 'wintun.dll'
      - 'WinDivert64.sys'
      - 'Packet.dll'

win:
  target:
    - target: nsis
      arch:
        - x64
  # 图标：client/build/icon.ico 由 `pnpm icons` 生成（多尺寸 16/24/32/48/64/128/256）
  icon: build/icon.ico
  #
  # signAndEditExecutable 必须是 true。
  # 之前这里是 false（注释写着"没有证书时避免打包失败"），代价是 electron-builder
  # **跳过 rcedit** —— 于是 exe 保留 Electron 自带的图标与元数据：
  # 任务栏/开始菜单显示的是 Electron 那个原子球，而不是 McLink 的标志。
  # 没有证书时 electron-builder 本来就会自动跳过签名，但 rcedit 该跑还是要跑。
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: McLink 联机
  # 安装器、卸载器与安装向导弹出窗口都用品牌图标（默认也是 build/icon.ico，写明更直观）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages:
    - zh_CN
  language: '2052'
  # 安装后不自动启动，避免用户毫无预期地弹出窗口
  runAfterFinish: false

# 中文安装界面
# 产物名与 server/src/services/settings.ts 的 clientArtifactName() 必须一致
artifactName: McLink-Setup-${version}-${arch}.${ext}
