# electron-builder 打包配置
#
# 品牌写法统一为 McLink（productName / 快捷方式 / 安装包名都面向玩家可见）。
# appId 保持不变：它是注册表与升级标识，改了会让老版本无法原地升级。
#
# 注意 productName 同时决定**安装目录与 userData 目录**（Windows 路径不区分大小写，
# 所以 mclink → McLink 不会丢失已登录状态）。改完要重新 `pnpm dist:client` 才生效，
# 同时把主控设置里的「客户端下载地址」改成本次产物名（或留空由下载页自动挑选）。
appId: com.mclink.client
productName: McLink
copyright: McLink · 基于 EasyTier 的《我的世界》联机平台

directories:
  output: release
  buildResources: build

# 只打包运行必需的文件；源码与开发脚本不进安装包
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - '!**/*.map'
  - '!**/node_modules/**/{test,tests,__tests__,example,examples,docs}/**'
# 注意：运行时用的图标在 client/electron/assets/icon.ico（随 electron/ 一起进 asar）。
# 不要写 `- build/icon.ico`：build/ 是 buildResources，electron-builder 会**自动排除**它，
# 写了也不生效 —— 现象是打包后 appIconPath() 找不到图标，托盘变成一个看不见的空图标。

# EasyTier 核心以「额外资源」形式随包分发（保持其原始二进制，不做修改）
# 清单与 client/scripts/build.mjs 的 WANTED_VENDOR_FILES 必须一致：
# 用通配符会连 Linux 二进制一起打进 Windows 安装包（约 10MB），
# 漏掉 WinDivert64.sys / Packet.dll 则「局域网广播直通」在打包版里静默失效。
extraResources:
  - from: vendor/easytier
    to: vendor/easytier
    filter:
      - 'easytier-core.exe'
      - 'easytier-cli.exe'
      - 'wintun.dll'
      - 'WinDivert64.sys'
      - 'Packet.dll'

win:
  target:
    - target: nsis
      arch:
        - x64
  # 图标：client/build/icon.ico 由 `pnpm icons` 生成（多尺寸 16/24/32/48/64/128/256）
  icon: build/icon.ico
  #
  # signAndEditExecutable 必须是 true。
  # 之前这里是 false（注释写着"没有证书时避免打包失败"），代价是 electron-builder
  # **跳过 rcedit** —— 于是 exe 保留 Electron 自带的图标与元数据：
  # 任务栏/开始菜单显示的是 Electron 那个原子球，而不是 McLink 的标志。
  # 没有证书时 electron-builder 本来就会自动跳过签名，但 rcedit 该跑还是要跑。
  signAndEditExecutable: true

# ---------------------------------------------------------------------------
# macOS
#
# 与 Windows 的三点不同，都写在下面：
#   1. **核心二进制不同**：vendor/easytier 里那批无扩展名的是 Linux 版（主控在用），
#      macOS 要用单独的 macos-arm64/ 与 macos-x64/ 子目录（来自 EasyTier 官方
#      easytier-macos-{aarch64,x86_64}-vX.Y.Z.zip）。
#   2. **没有签名证书**：不设 identity，产物是未签名包，玩家首次打开要绕过 Gatekeeper
#      （文档里给了 `xattr -dr com.apple.quarantine` 与右键打开的说明）。
#   3. **图标来源是 PNG**：icon-1024.png（由 `pnpm icons` 生成），electron-builder 自己转 icns。
#      .icns 要求 ≥512，256 会被直接拒绝。
# ---------------------------------------------------------------------------
mac:
  category: public.app-category.games
  icon: build/icon-1024.png
  #
  # 只保留中文与英文界面资源。
  # Electron 默认带 50 多种 locale 的 .pak（每种 ~200KB，加起来 20-30MB），
  # 我们的界面只有中文和英文，其余全是白送给玩家的下载量。
  electronLanguages:
    - zh-CN
    - en-US
  #
  # **产物名必须带 macos**：官网/下载页是按文件名判断平台与架构的
  # （server/src/api/public.ts 的 platformOf / archOf），沿用全局的
  # `McLink-Setup-${version}-${arch}.${ext}` 会让 mac 包被当成 Windows 产物、
  # 挂到 Windows 按钮上。所以 mac 侧单独覆盖成带 macos 的名字。
  artifactName: McLink-${version}-macos-${arch}.${ext}
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  extraResources:
    # 两个架构各自的 EasyTier 核心都带上；运行时按 process.arch 选子目录
    - from: ../vendor/easytier/macos-arm64
      to: vendor/easytier/macos-arm64
    - from: ../vendor/easytier/macos-x64
      to: vendor/easytier/macos-x64

dmg:
  # 未签名包：不写 volume 图标，避免在没有证书的机器上找 icns
  writeUpdateInfo: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: McLink 联机
  # 安装器、卸载器与安装向导弹出窗口都用品牌图标（默认也是 build/icon.ico，写明更直观）
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages:
    - zh_CN
  language: '2052'
  # 安装后不自动启动，避免用户毫无预期地弹出窗口
  runAfterFinish: false

# 中文安装界面
# 产物名与 server/src/services/settings.ts 的 clientArtifactName() 必须一致
artifactName: McLink-Setup-${version}-${arch}.${ext}
