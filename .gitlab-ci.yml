# GitLab CI：出 Windows 与 macOS 客户端安装包
#
# ⚠️ 现状：**主仓库已经换成 GitHub**（`origin` = github.com/McLink-Team/McLink，私有），
#    GitLab 远端改名成 `gitlab` 只读保留、不再推 —— 所以本文件当前**不会被触发**。
#    保留它的理由：GitLab 共享额度恢复后，这条是现成的备用出包路径
#    （见 docs/build-clients.md 的 1.1；macOS 包现在默认走 1.2 的 GitHub Actions）。
#
# ⚠️ 本文件里的 build:windows 是**既有 job，本次 macOS 改造一行未动**（回归门槛：
#    Windows 出包能力不能因为加 mac 支持而变坏）。macOS 的改动全部落在 build:macos。
#
# 前提（已确认可用）：本项目在 mc7984239/mc 上有 **macOS runner**
# （构建日志路径 /Users/gitlab/builds/... 就是它），所以 macOS job 直接自动跑。
# 如果哪天 runner 不可用，把 build:macos 的 `when` 改回 manual 即可。
#
# 为什么必须 macOS：electron-builder 明确拒绝在 Windows 上构建 macOS 包 ——
#   ⨯ Build for macOS is supported only on macOS
# （源码里只拦 Windows：packager.js 的 `platform === MAC && process.platform === 'win32'`）
#
# ⚠️ 本文件"能不能跑起来"只能在推送到 GitLab 之后验证：本地既没有 runner，
#    也没有 GitLab 的 rules 求值器。本地能验的只有 YAML 语法 + job/tags/artifacts
#    的静态断言（见 client/scripts/verify-platform.mjs 与 docs/build-clients.md）。

stages:
  - build

variables:
  VITE_MCLINK_MASTER: 'https://cnnic.link'
  # 没有 Apple 证书：不做真实签名（ad-hoc 签名由 deploy/sign-macos-app.sh 补）
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

# ---------------------------------------------------------------- Windows
build:windows:
  stage: build
  tags:
    - saas-windows-medium-amd64
  rules:
    # 推代码**不再**触发构建：GitLab 额度有限，出包是主动行为。
    # 要出包时在 GitLab → CI/CD → Pipelines 点「Run pipeline」，或推一个 v* 标签。
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == 'web'
  script:
    - node --version
    - corepack enable
    - pnpm install --frozen-lockfile
    # 显式指定平台，不再依赖宿主架构推断（上一版就是在这里取错资产名导致 404）
    - node scripts/fetch-easytier.mjs --windows
    - pnpm icons
    # 不要用 cd client && …：GitLab 的 Windows runner 是 PowerShell 5.1，
    # 它不支持 &&（PowerShell 7 才有），构建会**静默不执行**（解析错误被当成非终止错误，
    # 退出码仍是 0，job 显示 success 却没有产物）。用 pnpm 的 filter 指定工作目录，
    # 它对两种 shell 都成立。
    - pnpm --filter @mclink/client exec node scripts/dist.mjs --win nsis
    - node deploy/assert-artifacts.mjs --windows
  artifacts:
    name: 'mclink-windows-$CI_COMMIT_SHORT_SHA'
    paths:
      - client/release/*.exe
    expire_in: 30 days

# ---------------------------------------------------------------- macOS
#
# 这个 job **只在 macOS runner 上跑**（tags 决定），出 dmg + zip 作为 artifacts。
# 它是唯一能产出 macOS 包的路径：electron-builder 不允许在 Windows/Linux 上跨平台构建 mac。
#
# runner tag 换法：下面 tags 里的 `saas-macos-medium-m1` 就是 GitLab.com SaaS 的
# Apple 芯片 macOS runner（用户已确认项目上可用）。换机器时**直接改这个字面量**——
# 不写成变量：GitLab 文档里 tags 虽然支持变量展开，但它发生在 GitLab 侧、
# 依赖实例版本与变量作用域，而写错的表现是 job 永远停在 pending（最难排查的一种失败）。
# 可替换的值：saas-macos-medium-m1（M1）/ saas-macos-large-m2pro（M2 Pro，更贵）。
build:macos:
  stage: build
  tags:
    - saas-macos-medium-m1
  rules:
    # 打 v* 标签：自动跑，且**失败就是失败**（发布路径不允许静默跳过 mac 包）
    - if: $CI_COMMIT_TAG
    # 「Run pipeline」按需出包：默认手动。
    # allow_failure: true 只放在这条规则里 —— 手动 job 被"跳过"时不该把整条 pipeline
    # 卡成 blocked（那会让"Run pipeline 只出 Windows"这件事看起来像出错了）。
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: manual
      allow_failure: true
  script:
    - node --version
    - corepack enable
    - pnpm install --frozen-lockfile
    # --macos = 两个架构的 mac 核心（arm64 用 aarch64 命名，别再按宿主架构拼）
    - node scripts/fetch-easytier.mjs --macos
    - pnpm icons
    # 只出 zip：dmg 由下面的签名脚本在**签名之后**生成（electron-builder 的 dmg 里是未签名副本）
    - pnpm --filter @mclink/client exec node scripts/dist.mjs --mac zip --arm64 --x64
    - node deploy/assert-artifacts.mjs --macos
    # 未签名包在 Apple 芯片上会被内核拒绝执行 —— 这里补 ad-hoc 签名并用 zip -y 重打包
    - bash deploy/sign-macos-app.sh
    # 证据：核心架构、asar 是否在、签名结果
    - |
      for A in client/release/mac-*/McLink.app; do
        echo "== $A"
        file "$A/Contents/Resources/vendor/easytier/"*/easytier-core || true
        ls -l "$A/Contents/Resources/app.asar" || true
        codesign -dv --verbose=2 "$A" 2>&1 | head -5 || true
      done
    # 逐项列出产物体积与总计：artifact 里是所有产物之和（两个架构 × zip+dmg），
    # 单个包 ~130MB 是 Electron 的正常体量，总计 ~500MB 也正常 —— 但要把账算给看日志的人
    - ls -lh client/release/*.dmg client/release/*.zip 2>/dev/null || true
    - du -ch client/release/*.dmg client/release/*.zip 2>/dev/null | tail -1 || true
    - du -sh client/release/*.app 2>/dev/null || true
  artifacts:
    name: 'mclink-macos-$CI_COMMIT_SHORT_SHA'
    paths:
      - client/release/*.dmg
      - client/release/*.zip
    expire_in: 30 days

