name: 构建客户端（Windows / macOS）

# 这个工作流是干什么的
# --------------------
# macOS 包**只能在 macOS 上出**。electron-builder 源码里写死了这条判断
# （app-builder-lib/out/packager.js 的 doBuild）：
#
#     if (platform === Platform.MAC && process.platform === Platform.WINDOWS.nodeName) {
#       throw new InvalidConfigurationError('Build for macOS is supported only on macOS, ...')
#     }
#
# 它只拦 Windows，所以 Linux 上"能跑"—— 但没有 codesign（签名）与 hdiutil（dmg），
# 出来的是**未签名**包，Apple 芯片的机器双击就是「已损坏，无法打开」。
# 那条路能出什么、怎么出，见 deploy/build-macos-on-linux.sh 的头部注释（只出 zip，不推荐）。
#
# 为什么用 GitHub
# --------------
# GitHub 现在是**主仓库**（git 远端 `origin` 指向它），GitLab 只留作历史备份
# （远端名 `gitlab`，不再推）。macOS 包也只剩这一条出包路径：GitLab SaaS 的
# macOS runner 吃每月共享额度、额度已经用完，而 GitHub 私有仓库有 2,000 分钟/月
# （macOS 按 10 倍折算），够用且可控。
#
# 怎么用
# ------
# 仓库：**https://github.com/McLink-Team/McLink**（私有）
#
#   git push                       # origin 已经是 GitHub，不用再加远端
#   GitHub → Actions →「构建客户端」→ Run workflow
# 跑完在这次的 Artifacts 里下载 **mclink-macos**（默认是两个 dmg）。
#
# 从哪个提交构建：**直接在当前主分支（main）上跑**。1.0.9 的 mac 包要带上
# 「mac 客户端的更新提示不该指向 Windows 安装包」这处修复，而它是在打 v1.0.9 标签
# 之后才提交的 —— 从标签构建会漏掉它。版本号由 client/package.json 决定（1.0.9），
# 文件名不变，主控下载页照旧能认；重跑同一个 ref 会覆盖同名 artifact，是安全的。
#
# 额度与存储（私有仓库，GitHub Free）
# ---------------------------------
#   · 分钟：2,000 分钟/月，macOS 按 **10 倍**折算 → 一次 mac 构建（十几分钟）≈ 100~200 分钟额度。
#     公开仓库不计量，但那样 mclink 的源码就公开了。
#   · 存储：**500 MB**。一次 mac 产物（两个架构 × dmg + zip）差不多正好 500MB，
#     所以这里**默认只上传两个 dmg**（≈260MB，玩家拖进「应用程序」用的就是它），
#     保留 7 天；需要 zip 时勾上 input `full_artifacts`（只留 1 天，且可能超 500MB 上限）。
#   · 校验值在日志最后一步（`shasum -a 256`）里，传完可以拿它核对有没有传错文件。
#
# 产物与签名
# ----------
#   · Windows：McLink-Setup-<版本>-x64.exe（NSIS 安装包）
#   · macOS  ：McLink-<版本>-macos-arm64.dmg/.zip（Apple 芯片）、McLink-<版本>-macos-x64.dmg/.zip（Intel）
#     文件名里的 macos 是官网识别平台用的，别改：server/src/api/public.ts 按文件名分流平台与架构。
#   · 我们**没有 Apple 开发者证书**，electron-builder 会跳过签名 → 由
#     deploy/sign-macos-app.sh 补 ad-hoc 签名，并在**签名之后**重新生成 dmg
#     （electron-builder 的 dmg 里装的是签名之前的副本）。少了这一步，Apple 芯片上
#     双击就是「已损坏，无法打开」。玩家首次打开还需绕过 Gatekeeper，见 docs/build-clients.md。

on:
  # **只保留手动触发**（workflow_dispatch）：GitHub 现在是主仓库，标签也会推上来，
  # 而一次 mac 构建要吃掉私有仓库月度额度的 1/10 —— 让"推个标签"顺手触发构建是危险的。
  # 需要 mac 包时到 Actions →「构建客户端」→ Run workflow 点一次。
  # 如果哪天确实想让 `v*` 标签自动出包，在下面加回：
  #   push:
  #     tags:
  #       - 'v*'
  workflow_dispatch:
    inputs:
      master:
        description: 内嵌进客户端的主控地址
        required: false
        default: https://cnnic.link
      windows:
        description: 顺便出 Windows 包（mac 包不需要它；私有仓库会多花额度）
        type: boolean
        required: false
        default: false
      full_artifacts:
        description: 连 zip 一起上传（私有仓库存储上限 500MB，容易超）
        type: boolean
        required: false
        default: false

env:
  # 没有证书时让 electron-builder 跳过签名发现（macOS 上仍由 sign-macos-app.sh 做 ad-hoc 签名）
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: Windows x64
    # 手动跑时默认**跳过**：这个工作流存在的理由是 mac 包，Windows 包本地与 GitLab 都能出，
    # 而私有仓库的额度是按分钟扣的（Windows 还要按 2 倍折算）。需要时勾上 input 即可。
    if: github.event_name == 'push' || inputs.windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 用 pnpm/action-setup 而不是 `corepack enable`：corepack 是否随 Node 一起分发取决于
      # Node 版本（Node 25 起已移除），而 action-setup 装的就是 package.json 里
      # packageManager 的那一版（pnpm@10.33.2）—— 与本地、与 GitLab CI 完全一致。
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 取 EasyTier 核心（Windows）
        run: node scripts/fetch-easytier.mjs --windows

      - name: 生成图标
        run: pnpm icons

      - name: 打包
        env:
          VITE_MCLINK_MASTER: ${{ inputs.master || 'https://cnnic.link' }}
        run: pnpm --filter @mclink/client exec node scripts/dist.mjs --win nsis

      # 与 GitLab 的 build:windows 同一步骤：构建"看起来成功"但没产物时必须让 job 失败，
      # 否则上传 artifacts 才报 "no matching files"，排查起来只看到一句 404。
      - name: 校验产物
        run: node deploy/assert-artifacts.mjs --windows

      - uses: actions/upload-artifact@v4
        with:
          name: mclink-windows-x64
          path: client/release/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS arm64 + x64
    # macos-14 已被 GitHub 标记为 deprecated（runner-images 的 Available Images 表里带
    # deprecated 徽章），所以 pin 在仍在 GA 的 **arm64** 镜像 macos-15 上：
    # 需要 arm64 才能原生出 Apple 芯片包，x64 由 electron-builder 在同一台机器上交叉出
    # （GitLab 那边 pin 的 M1 runner 也是这么干的）。
    # 别写 macos-15-intel / -large（x64 或收费的更大规格），也别写 macos-latest（会被自动迁移）。
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # --macos = 两个架构的 mac 核心（arm64 的资产名叫 aarch64，别再按宿主架构拼）
      - name: 取 EasyTier 核心（含 macOS 两个架构）
        run: node scripts/fetch-easytier.mjs --macos

      - name: 生成图标（含 macOS 需要的 1024 尺寸）
        run: pnpm icons

      # 只出 zip：dmg 由下面的签名脚本在**签名之后**生成（electron-builder 的 dmg 里是未签名副本）
      - name: 打包 macOS（两个架构）
        env:
          VITE_MCLINK_MASTER: ${{ inputs.master || 'https://cnnic.link' }}
        run: pnpm --filter @mclink/client exec node scripts/dist.mjs --mac zip --arm64 --x64

      - name: 校验产物
        run: node deploy/assert-artifacts.mjs --macos

      # 未签名包在 Apple 芯片上会被内核拒绝执行 —— 这里补 ad-hoc 签名并用 zip -y 重打包
      - name: ad-hoc 签名并生成 dmg
        run: bash deploy/sign-macos-app.sh

      # 证据：核心架构、asar 是否在、签名结果、体积与校验值
      # （校验值给的是"下载页上玩家核对的那一份"，发布后可以拿它对照是否传错文件）
      - name: 列出产物与校验值
        run: |
          for A in client/release/mac-*/McLink.app; do
            echo "== $A"
            file "$A/Contents/Resources/vendor/easytier/"*/easytier-core || true
            ls -l "$A/Contents/Resources/app.asar" || true
            codesign -dv --verbose=2 "$A" 2>&1 | head -5 || true
          done
          ls -lh client/release/*.dmg client/release/*.zip 2>/dev/null || true
          du -ch client/release/*.dmg client/release/*.zip 2>/dev/null | tail -1 || true
          shasum -a 256 client/release/*.dmg client/release/*.zip 2>/dev/null || true

      # 私有仓库的 Actions 存储只有 500MB（GitHub Free），而两个架构 × dmg + zip 差不多
      # 正好 500MB —— 默认只留 dmg（玩家双击拖进「应用程序」用的就是它），保留 7 天。
      - name: 上传产物（dmg）
        uses: actions/upload-artifact@v4
        with:
          name: mclink-macos
          path: client/release/*.dmg
          if-no-files-found: error
          retention-days: 7

      # zip 是给"习惯解压"的玩家与下载页的第二入口用的：要它就勾 full_artifacts。
      # 只留 1 天 —— 它和 dmg 加起来会顶到 500MB 的存储上限。
      - name: 上传产物（zip，可选）
        if: inputs.full_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mclink-macos-zip
          path: client/release/*.zip
          if-no-files-found: error
          retention-days: 1
